            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);

        }
        
        .link-item::before {

            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, transparent 70%);

            transition: opacity 0.35s ease;
            pointer-events: none;

        .link-item:hover::before {

        }
        
        .link-item:hover {

            border-color: var(--border-strong);
